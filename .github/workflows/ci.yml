name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_KEY: 9a627609771982875b75b6b28ff59091f40c5a116df11c1fffb94f37a51df436

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # The runner's own CPython links SQLite 3.46.1, which the broker refuses (SQLITE_PATCH: the WAL-reset
      # fix needs 3.51.3+, 3.50.7+ or 3.44.6+; pysqlite3-binary 0.5.4.post2 bundles 3.51.1). uv-managed CPython
      # bundles a fixed SQLite (3.53.1 in the local verification run), so CI uses it instead.
      - uses: astral-sh/setup-uv@v10.4.0  # this action publishes full version tags only
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python -r requirements.txt mcp==2.3.0 -e .  # the MCP client of the conformance record
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: mizan --data "$RUNNER_TEMP/doctor" doctor

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Safety suite (quick)
        run: python scripts/safety_suite.py --quick --out "$RUNNER_TEMP/safety.json"

      - name: Exhibit logic under Node WebCrypto
        run: node scripts/check_exhibit_logic.mjs

      - name: Exhibit verifies against the pinned key
        run: python -m mizan verify reports/demo/demo_results.json --expected-key "$PINNED_KEY"
