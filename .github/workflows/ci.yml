name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_KEY: 9a627609771982875b75b6b28ff59091f40c5a116df11c1fffb94f37a51df436

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mcp
          python -m pip install -e .
          mizan --data "$RUNNER_TEMP/doctor" doctor

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Safety suite (quick)
        run: python scripts/safety_suite.py --quick --out "$RUNNER_TEMP/safety.json"

      - name: Exhibit logic under Node WebCrypto
        run: node scripts/check_exhibit_logic.mjs

      - name: Exhibit verifies against the pinned key
        run: python -m mizan verify reports/demo/demo_results.json --expected-key "$PINNED_KEY"
