name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which installs packages and runs code) can only read; only the deploy job,
# which runs nothing but actions/deploy-pages, can write to Pages and request an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read  # actions/configure-pages reads the repository's Pages settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -r requirements.txt playwright==1.65.2  # the version of the recorded browser checks

      - name: Exhibit logic under Node WebCrypto
        run: node scripts/check_exhibit_logic.mjs

      - name: Build site (verifies signatures, page provenance and report figures first)
        run: python scripts/build_site.py --out _site

      - name: Check the built site in Chromium
        run: |
          python -m playwright install --with-deps chromium
          CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()")
          python scripts/check_exhibits.py --chromium "$CHROME" --demo _site/exhibit/index.html --spaces _site --site _site --out "$RUNNER_TEMP/browser.json"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
